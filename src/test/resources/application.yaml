spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:5432}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
app:
  jwt:
    secret: ${JWT_SECRET:default_local_secret_key_for_testing_1234567890}
    access-expiration-time: ${JWT_ACCESS_TIME:3600000}
    refresh-expiration-time: ${JWT_REFRESH_TIME:1209600000}
  auth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      redirect-uri: ${KAKAO_REDIRECT_URL:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      api-base-url: https://kapi.kakao.com
      authorization-base-url: https://kauth.kakao.com