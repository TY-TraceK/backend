spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:5432}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
app:
  jwt:
    secret: ${JWT_SECRET:default_local_secret_key_for_testing_1234567890}
    access-expiration-time: ${JWT_ACCESS_TIME:3600000}
    refresh-expiration-time: ${JWT_REFRESH_TIME:1209600000}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace