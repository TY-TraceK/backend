spring:
  application:
    name: traceK
  profiles:
    active: ${SPRING_PROFILE:local}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
server:
  # HTTP 응답 압축 (클라이언트가 Accept-Encoding: gzip을 보낼 때만 적용, 브라우저는 자동 해제)
  # 지도 bounds처럼 큰 JSON 응답의 전송 시간을 줄이기 위함. 1KB 미만 응답은 압축 이득보다 비용이 커서 제외
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1KB
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
storage:
  local:
    path: uploads
app:
  jwt:
    secret: ${JWT_SECRET:default_local_secret_key_for_testing_1234567890}
    access-expiration-time: ${JWT_ACCESS_TIME:3600000}
    refresh-expiration-time: ${JWT_REFRESH_TIME:1209600000}
  auth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      redirect-uri: ${KAKAO_REDIRECT_URL:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      api-base-url: https://kapi.kakao.com
      authorization-base-url: https://kauth.kakao.com
  tour-api:
    service-key: ${TOUR_API_SERVICE_KEY:}
    base-url: https://apis.data.go.kr/B551011/KorService2
    mobile-os: ETC
    mobile-app: TraceK
  cors:
    allowed-origin-urls:
      - "http://localhost:5173"
      - "https://frontend-*.vercel.app"
  security:
    permit-all-urls:
      - "/docs/**"
      - "/swagger-ui/**"
      - "/v3/api-docs/**"
      - "/actuator/**"
      - "/api/public/**"
      - "/api/test/**"
      - "/api/auth/**"
      - "/api/rankings/**"
      - "/uploads/**"