<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606A"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F46800"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8250DF"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1F2328" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1000" height="600" rx="16" fill="#FFFFFF"/>
  <text x="40" y="38" font-size="18" font-weight="700" fill="#1F2328">KRoute System Architecture</text>

  <!-- User -->
  <circle cx="70" cy="200" r="28" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <circle cx="70" cy="191" r="8" fill="#6366F1"/>
  <path d="M55,214 a15,11 0 0 1 30,0 z" fill="#6366F1"/>
  <text x="70" y="250" font-size="13" text-anchor="middle" fill="#1F2328">사용자</text>

  <!-- Frontend -->
  <rect x="140" y="165" width="140" height="70" rx="10" fill="#E8F7FC" stroke="#22B8E0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="192" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2328">Frontend</text>
  <text x="210" y="210" font-size="11.5" text-anchor="middle" fill="#57606A">React · Vite</text>
  <text x="210" y="226" font-size="11.5" text-anchor="middle" fill="#57606A">Vercel</text>
  <line x1="99" y1="200" x2="137" y2="200" stroke="#57606A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AWS EC2 -->
  <rect x="310" y="60" width="380" height="330" rx="14" fill="#FFF8F0" stroke="#FF9900" stroke-width="2"/>
  <text x="328" y="85" font-size="14" font-weight="700" fill="#CC7A00">AWS EC2</text>
  <rect x="330" y="98" width="340" height="276" rx="10" fill="none" stroke="#2496ED" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="346" y="119" font-size="12" font-weight="600" fill="#2496ED">Docker Compose</text>

  <!-- Spring Boot -->
  <rect x="400" y="135" width="200" height="70" rx="10" fill="#EEF8E8" stroke="#6DB33F" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="163" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2328">Spring Boot</text>
  <text x="500" y="183" font-size="11.5" text-anchor="middle" fill="#57606A">Java 21 · JPA · QueryDSL</text>

  <!-- MySQL -->
  <rect x="350" y="255" width="135" height="62" rx="10" fill="#EAF2FA" stroke="#4479A1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="417" y="281" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2328">MySQL 8.4</text>
  <text x="417" y="300" font-size="11" text-anchor="middle" fill="#57606A">FULLTEXT · R-Tree</text>

  <!-- Redis -->
  <rect x="515" y="255" width="135" height="62" rx="10" fill="#FDEDEB" stroke="#DC382D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="582" y="281" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2328">Redis 7.2</text>
  <text x="582" y="300" font-size="11" text-anchor="middle" fill="#57606A">TourAPI 캐시</text>

  <!-- node-exporter -->
  <rect x="450" y="332" width="100" height="28" rx="7" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.2"/>
  <text x="500" y="350" font-size="11" text-anchor="middle" fill="#57606A">node-exporter</text>

  <line x1="455" y1="206" x2="425" y2="252" stroke="#57606A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="545" y1="206" x2="575" y2="252" stroke="#57606A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Frontend -> Spring Boot -->
  <line x1="282" y1="196" x2="397" y2="172" stroke="#57606A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="337" y="160" font-size="11" fill="#57606A">REST API</text>

  <!-- External services -->
  <text x="760" y="70" font-size="12" font-weight="600" fill="#57606A">External</text>
  <rect x="760" y="80" width="190" height="56" rx="10" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="855" y="104" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1F2328">한국관광공사 TourAPI</text>
  <text x="855" y="122" font-size="11" text-anchor="middle" fill="#57606A">관광지 사진 · 소개</text>

  <rect x="760" y="150" width="190" height="56" rx="10" fill="#FFFBE0" stroke="#E6C200" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="855" y="174" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1F2328">Kakao OAuth</text>
  <text x="855" y="192" font-size="11" text-anchor="middle" fill="#57606A">소셜 로그인</text>

  <rect x="760" y="220" width="190" height="56" rx="10" fill="#FFF4E5" stroke="#FF9900" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="855" y="244" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1F2328">AWS S3</text>
  <text x="855" y="262" font-size="11" text-anchor="middle" fill="#57606A">이미지 저장</text>

  <path d="M601,160 C680,160 680,108 757,108" fill="none" stroke="#57606A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M601,170 C680,170 680,178 757,178" fill="none" stroke="#57606A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M601,180 C680,180 680,248 757,248" fill="none" stroke="#57606A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Monitoring -->
  <rect x="760" y="305" width="190" height="56" rx="10" fill="#FFF1E8" stroke="#F46800" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="855" y="329" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1F2328">Prometheus · Grafana</text>
  <text x="855" y="347" font-size="11" text-anchor="middle" fill="#57606A">메트릭 모니터링</text>
  <path d="M757,322 C700,322 660,205 603,198" fill="none" stroke="#F46800" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-orange)"/>
  <path d="M757,342 C680,342 620,346 553,346" fill="none" stroke="#F46800" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-orange)"/>

  <!-- CI / CD lane -->
  <rect x="40" y="430" width="920" height="140" rx="14" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
  <text x="60" y="456" font-size="14" font-weight="700" fill="#1F2328">CI / CD</text>

  <rect x="70" y="478" width="150" height="62" rx="10" fill="#FFFFFF" stroke="#24292F" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="145" y="504" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2328">GitHub</text>
  <text x="145" y="523" font-size="11" text-anchor="middle" fill="#57606A">develop push</text>

  <rect x="275" y="478" width="250" height="62" rx="10" fill="#FFFFFF" stroke="#2088FF" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="504" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2328">GitHub Actions</text>
  <text x="400" y="523" font-size="11" text-anchor="middle" fill="#57606A">Spotless → Test · JaCoCo → Build</text>

  <rect x="570" y="478" width="150" height="62" rx="10" fill="#FFFFFF" stroke="#8250DF" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="645" y="504" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2328">GHCR</text>
  <text x="645" y="523" font-size="11" text-anchor="middle" fill="#57606A">Docker 이미지</text>

  <line x1="221" y1="509" x2="272" y2="509" stroke="#57606A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="526" y1="509" x2="567" y2="509" stroke="#57606A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="645" y1="476" x2="645" y2="394" stroke="#8250DF" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
  <text x="655" y="420" font-size="11" fill="#8250DF">SSH 배포 · 이미지 pull</text>

  <!-- Legend -->
  <line x1="770" y1="490" x2="800" y2="490" stroke="#57606A" stroke-width="1.5"/>
  <text x="808" y="494" font-size="11" fill="#57606A">요청 흐름</text>
  <line x1="770" y1="512" x2="800" y2="512" stroke="#F46800" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="808" y="516" font-size="11" fill="#57606A">메트릭 수집 (Actuator)</text>
  <line x1="770" y1="534" x2="800" y2="534" stroke="#8250DF" stroke-width="1.8"/>
  <text x="808" y="538" font-size="11" fill="#57606A">배포</text>
</svg>
