name: Backend CI

on:
  push:
    branches:
      - develop
      - main
      - feature/**
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SPRING_PROFILE: dev
      DB_HOST: localhost
      DB_PORT: 3306
      DB_NAME: tracek
      DB_USERNAME: ${{ secrets.MYSQL_USER }}
      DB_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tracek
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD} --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      # 코드 포맷팅
      - name: Check Code Formatting
        run: ./gradlew spotlessCheck

      # 테스트 실행 및 JaCoCo 리포트 생성
      - name: Run Tests
        run: ./gradlew test

      # 테스트 제외 최종 빌드 (JAR 생성 검증)
      - name: Build Project
        run: ./gradlew build -x test

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          script: |
            set -e
            cd "${{ secrets.EC2_DEPLOY_PATH }}"
            git fetch origin
            if [ "$(git rev-parse origin/develop)" != "${{ github.sha }}" ]; then
              echo "origin/develop moved past ${{ github.sha }} already; skipping so the newer run deploys instead."
              exit 0
            fi
            git checkout develop
            git reset --hard ${{ github.sha }}
            docker compose up -d --build