name: tracek

version: "3.9"

services:

  mysql:
    image: mysql:8.4
    container_name: tracek-mysql

    restart: unless-stopped

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: tracek-backend

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379

    ports:
      - "8080:8080"


  redis:
    image: redis:7.2-alpine
    container_name: tracek-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      # 데이터 영속성을 위한 볼륨 연결
      - redis-data:/data
    command: redis-server --appendonly yes

volumes:
  mysql-data:
  redis-data: